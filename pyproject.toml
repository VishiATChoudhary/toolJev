[project]
name = "tooljev"
version = "0.1.0"
description = "Code Mode MCP gateway with Jev as the in-code decision primitive."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishisht Choudhary" }]
keywords = ["mcp", "model-context-protocol", "code-mode", "agents", "tool-calling", "jev", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=4.0",
    "pydantic-monty>=1.0",
    "typesafe-sdk>=0.7",
]

[project.optional-dependencies]
local = ["nanojev"]
# Dense half of search recall; without it search falls back to BM25 only.
retrieval = ["sentence-transformers>=3.0"]
bench = ["sentence-transformers>=3.0", "pandas", "pyarrow", "datasets", "matplotlib"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
tooljev = "tooljev.server:main"

[project.urls]
Homepage = "https://github.com/VishiATChoudhary/toolJev"
Results = "https://github.com/VishiATChoudhary/toolJev/blob/main/bench/RESULTS.md"

[tool.uv.sources]
nanojev = { git = "https://github.com/VishiATChoudhary/nanojev" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tooljev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: loads a local model", "hosted: calls the TypeSafe API"]
